<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Dashboard | FarmLink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FarmLink</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="consumer.html">Consumer</a>
    <a href="farmer.html">Farmer</a>
  </nav>
</header>

<main>
  <section>
    <h2>List Your Produce</h2>
    <form>
      <label>Produce name</label><br>
      <input type="text" placeholder="e.g. Onion"><br><br>

      <label>Quantity (kg)</label><br>
      <input type="number"><br><br>

      <label>Expected price (₹/kg)</label><br>
      <input type="number"><br><br>

      <button type="button">Submit listing</button>
    </form>
  </section>

  <section>
    <h2>Today's Market Prices</h2>
    <table border="1" cellpadding="8">
      <tr>
        <th>Produce</th>
        <th>Price per kg</th>
      </tr>
      <tr>
        <td>Tomato</td>
        <td>₹30</td>
      </tr>
      <tr>
        <td>Mango</td>
        <td>₹90</td>
      </tr>
    </table>
  </section>
</main>

<footer><p>&copy; 2026 FarmLink</p></footer>
</body>
</html>
