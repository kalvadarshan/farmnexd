<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumer | FarmLink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FarmLink</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="consumer.html">Consumer</a>
    <a href="farmer.html">Farmer</a>
  </nav>
</header>

<main>
  <section>
    <h2>Fresh Produce</h2>
    <input type="text" id="search" placeholder="Search tomato, mango...">
    <p>Cart items: <span id="cartCount">0</span></p>

    <div class="cards" id="products">
      <div class="card product">
        <h3>Tomato</h3>
        <p>₹30 / kg</p>
        <button onclick="addToCart()">Add to cart</button>
      </div>
      <div class="card product">
        <h3>Mango</h3>
        <p>₹90 / kg</p>
        <button onclick="addToCart()">Add to cart</button>
      </div>
      <div class="card product">
        <h3>Potato</h3>
        <p>₹25 / kg</p>
        <button onclick="addToCart()">Add to cart</button>
      </div>
    </div>
  </section>
</main>

<footer><p>&copy; 2026 FarmLink</p></footer>

<script>
  let count = 0;

  function addToCart() {
    count = count + 1;
    document.getElementById("cartCount").textContent = count;
  }

  document.getElementById("search").addEventListener("input", function () {
    const text = this.value.toLowerCase();
    document.querySelectorAll(".product").forEach(function (item) {
      item.style.display = item.textContent.toLowerCase().includes(text) ? "block" : "none";
    });
  });
</script>
</body>
</html>
